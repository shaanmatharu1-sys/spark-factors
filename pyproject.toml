[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-factors"
version = "0.1.0"
description = "Single definition of every SPARK factor, shared by SPARK research and the live engine."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["spark_factors*"]

[tool.setuptools.package-data]
spark_factors = ["text/*.json", "fixtures/*.npz", "fixtures/*.json"]
